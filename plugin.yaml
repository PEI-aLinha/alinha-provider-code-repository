# Plugin manifest — keep in sync with CodeRepositoryPlugin.kt (backend).
id: code-repository
name: "Code Repository"
kind: provider
version: 0.1.0
# Where this repo lives as a submodule inside the main repo (PEI-aLinha/alinha)
path: plugins/provider/code-repository
publishes: [EvidenceCollected]        # pt.alinha.pluginapi (plugin-api), one per stored evidence
consumes: [JobCompleted, JobFailed]   # results of the evidence.collect jobs this plugin dispatched
permissions:      # RBAC resources; role mapping lives in CodeRepositoryPlugin.kt
  - code-repository:read      # responsible, analyst, consultant: connection state and evidence
  - code-repository:connect   # responsible, analyst, consultant: connect, disconnect, collect now
nav:              # menu entries; GET /api/plugins shows each one only to roles with its permission
  - label: "Repositório de código"
    path: integrations/code-repository
    area: client
    resource: code-repository    # checked as code-repository:read
    order: 70
