# Tests THIS plugin inside the main repo (which has the core and the other plugins) and sends the analysis
# and coverage to this repo's SonarCloud project. The steps live in the main repo:
# PEI-aLinha/alinha/.github/workflows/plugin-ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # SonarCloud PR decoration

jobs:
  ci:
    # Coordinated change with PEI-aLinha/alinha (plugin-api, OpenAPI contract, pnpm-lock.yaml): test against the
    # main repo's branch of the same name. Back to @main, without main-ref, before merging.
    uses: PEI-aLinha/alinha/.github/workflows/plugin-ci.yml@feat/code-repository-provider
    with:
      main-ref: feat/code-repository-provider
      plugin-path: plugins/provider/code-repository
      gradle-project: code-repository
      npm-package: "@alinha/plugin-code-repository"
    secrets:
      ALINHA_READ_TOKEN: ${{ secrets.ALINHA_READ_TOKEN }}   # private repos only
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
